<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 P2P Multi-room Chat</title>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://unpkg.com/simple-peer@9/simplepeer.min.js"></script>

<style>
body { text-align:center; font-family:sans-serif; background:#e5ddd5; margin:0; padding:0; }
#chat { height:60vh; width:90vw; max-width:400px; border:1px solid #333; overflow:auto; margin:10px auto; padding:10px; }
.message { max-width:70%; padding:8px 12px; margin:5px; border-radius:15px; clear:both; word-wrap:break-word; }
.me { background:#95ec69; float:right; text-align:right; }
.other { background:white; float:left; text-align:left; }
#status { font-size:16px; margin:10px; padding:10px; border-radius:10px; }
#inputArea { display:flex; justify-content:center; margin-bottom:10px; }
input { padding:8px; flex:1; max-width:250px; margin-right:5px; }
button { padding:8px 16px; background:#00c300; color:white; border:none; cursor:pointer; }
#loginArea { margin:20px; }
</style>
</head>
<body>

<h1>📡 P2P Multi-room Chat</h1>
<div id="status">🔴 未接続</div>
<div id="loginArea">
  <input id="usernameInput" placeholder="名前を入力">
  <input id="roomInput" placeholder="ルーム名入力" value="room1">
  <button onclick="login()">参加</button>
</div>
<div id="chat" style="display:none;"></div>
<div id="inputArea" style="display:none;">
  <input id="msg" placeholder="メッセージ入力">
  <button onclick="sendMsg()">送信</button>
</div>
<div id="log" style="display:none"></div>

<script>
//const socket = io("http://127.0.0.1:3000");
const socket = io("https://chat-be-7cfg.onrender.com");
let peers = {};
let username = null;
let currentRoom = null;
const statusEl = document.getElementById("status");
const chatEl = document.getElementById("chat");
const loginArea = document.getElementById("loginArea");
const inputArea = document.getElementById("inputArea");

socket.on('connect', () => { updateStatus(true); });

socket.on('disconnect', () => { updateStatus(false); });

socket.on('peers', users => { users.forEach(id => createPeer(id, true)); updateStatus(true); });

socket.on('new-peer', id => { createPeer(id, false); updateStatus(true); });

socket.on('signal', data => { peers[data.from]?.signal(data.signal); });

socket.on('peer-disconnect', id => { delete peers[id]; updateStatus(true); });

function login() {
  const uname = document.getElementById('usernameInput').value.trim();
  const room = document.getElementById('roomInput').value.trim();
  if (!uname || !room) { alert('名前とルーム名を入力してください'); return; }

  username = uname;
  currentRoom = room;

  loginArea.style.display = 'none';
  chatEl.style.display = 'block';
  inputArea.style.display = 'flex';

  socket.emit('join', currentRoom);
  updateStatus(true);
}

function createPeer(id, initiator) {
  const peer = new SimplePeer({ initiator, trickle:false });
  peer.on('signal', signal => socket.emit('signal', { to:id, signal }));
  peer.on('connect', () => { updateStatus(true); });
  peer.on('data', data => {
    const text = new TextDecoder().decode(data);
    const obj = JSON.parse(text);
    addMessage(obj.name + "： " + obj.msg, false);
  });
  peer.on('close', () => { delete peers[id]; updateStatus(true); });

  peers[id] = peer;
  updateStatus(true);
}

function sendMsg() {
  const msgInput = document.getElementById("msg");
  const msg = msgInput.value.trim();
  if (!msg || !currentRoom) return;

  const data = JSON.stringify({ name:username, msg });
  Object.values(peers).forEach(p => p.send(new TextEncoder().encode(data)));
  addMessage("自分： " + msg, true);
  msgInput.value = '';
}

function addMessage(msg, me=false) {
  const div = document.createElement('div');
  div.className = 'message ' + (me ? 'me' : 'other');
  const urlPattern = /(https?:\/\/\S+)/g;
  div.innerHTML = msg.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function updateStatus(isConnected=true) {
  const count = Object.keys(peers).length + 1;

  if (!username || !currentRoom) {
    statusEl.innerHTML = '🔴 未接続';
    return;
  }

  if (isConnected && count > 1) {
    statusEl.innerHTML = `接続人数: (${count}): <span style='color:green'>🟢 ${username}（ ${currentRoom} 接続中）</span>`;
  } else if (isConnected) {
    statusEl.innerHTML = `接続人数: (${count}): <span style='color:green'>🟢 ${username}（ ${currentRoom} 接続中）</span>`;
  } else {
    statusEl.innerHTML = `接続人数: (${count}): <span style='color:red'>🔴 ${username}（ ${currentRoom} 接続障害）</span>`;
  }
}
</script>

</body>
</html>
